<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgBase" x1="46" y1="0" x2="470" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA48A"/>
      <stop offset="0.35" stop-color="#F57E66"/>
      <stop offset="0.7" stop-color="#E8654E"/>
      <stop offset="1" stop-color="#CE4835"/>
    </linearGradient>
    <radialGradient id="bgBloom" cx="0.26" cy="0.02" r="0.8">
      <stop offset="0" stop-color="#FFEBE0" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#FFC8B4" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgVignette" cx="0.5" cy="0.42" r="0.82">
      <stop offset="0.65" stop-color="#8A2716" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A2716" stop-opacity="0.1"/>
    </radialGradient>

    <linearGradient id="glassBody" x1="256" y1="74" x2="256" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.4" stop-color="#FFFAF7" stop-opacity="0.94"/>
      <stop offset="0.78" stop-color="#FFF0E8" stop-opacity="0.89"/>
      <stop offset="1" stop-color="#FFE7DC" stop-opacity="0.86"/>
    </linearGradient>
    <radialGradient id="specular" cx="0.34" cy="-0.04" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="96" y1="82" x2="348" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="caustic" cx="0.5" cy="1.02" r="0.62">
      <stop offset="0" stop-color="#FF5F3C" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FF7050" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF7050" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="256" y1="74" x2="256" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ink" x1="124" y1="110" x2="390" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4795C"/>
      <stop offset="1" stop-color="#C63A22"/>
    </linearGradient>

    <!-- fanned sheets behind -->
    <linearGradient id="sheet2" x1="256" y1="74" x2="256" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="sheet3" x1="256" y1="74" x2="256" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>

    <clipPath id="cardClip"><rect x="88" y="74" width="336" height="364" rx="64"/></clipPath>

    <filter id="softBlur" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="cardShadow" x="-45%" y="-45%" width="190%" height="210%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#7C2313" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7C2313" flood-opacity="0.2"/>
    </filter>
    <filter id="sheetShadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7C2313" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgBase)"/>
  <rect width="512" height="512" fill="url(#bgBloom)"/>
  <rect width="512" height="512" fill="url(#bgVignette)"/>

  <g transform="translate(256,256) scale(0.82) translate(-256,-256)">
  
    <!-- page 3 · fanned left -->
    <g filter="url(#sheetShadow)">
      <rect x="88" y="74" width="336" height="364" rx="64" fill="url(#sheet3)" transform="rotate(-7 256 256)"/>
    </g>
    <rect x="89.5" y="75.5" width="333" height="361" rx="62.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" transform="rotate(-7 256 256)"/>
  
    <!-- page 2 · fanned right -->
    <g filter="url(#sheetShadow)">
      <rect x="88" y="74" width="336" height="364" rx="64" fill="url(#sheet2)" transform="rotate(6 256 256)"/>
    </g>
    <rect x="89.5" y="75.5" width="333" height="361" rx="62.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" transform="rotate(6 256 256)"/>
  
    <!-- front page -->
    <g filter="url(#cardShadow)">
      <rect x="88" y="74" width="336" height="364" rx="64" fill="url(#glassBody)"/>
    </g>
    <g clip-path="url(#cardClip)">
      <ellipse cx="256" cy="452" rx="235" ry="130" fill="url(#caustic)"/>
      <ellipse cx="204" cy="50" rx="270" ry="160" fill="url(#specular)"/>
      <rect x="88" y="74" width="336" height="364" fill="url(#sweep)"/>
      <rect x="94" y="80" width="336" height="364" rx="64" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="7" filter="url(#softBlur)"/>
      <rect x="82" y="66" width="336" height="364" rx="64" fill="none" stroke="#C44A2A" stroke-opacity="0.15" stroke-width="8" filter="url(#softBlur)"/>
      <rect x="88" y="74" width="336" height="5" fill="#FFFFFF" fill-opacity="0.9"/>
    </g>
    <rect x="89.5" y="75.5" width="333" height="361" rx="62.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  
    <!-- masthead -->
    <rect x="124" y="118" width="264" height="34" rx="14" fill="url(#ink)"/>
    <rect x="124" y="170" width="264" height="8" rx="4" fill="#A8503A" fill-opacity="0.42"/>
  
    <!-- lead photo + column -->
    <rect x="124" y="202" width="122" height="122" rx="23" fill="url(#ink)" fill-opacity="0.92"/>
    <rect x="266" y="204" width="122" height="18" rx="9" fill="#A8503A" fill-opacity="0.6"/>
    <rect x="266" y="242" width="122" height="18" rx="9" fill="#A8503A" fill-opacity="0.6"/>
    <rect x="266" y="280" width="84" height="18" rx="9" fill="#A8503A" fill-opacity="0.6"/>
  
    <!-- body -->
    <rect x="124" y="352" width="264" height="18" rx="9" fill="#A8503A" fill-opacity="0.5"/>
    <rect x="124" y="388" width="204" height="18" rx="9" fill="#A8503A" fill-opacity="0.5"/>
  </g>
</svg>
