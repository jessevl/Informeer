<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cardBody" x1="256" y1="74" x2="256" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFFAF6"/>
      <stop offset="1" stop-color="#FCEDE3"/>
    </linearGradient>
    <linearGradient id="sheet2" x1="256" y1="74" x2="256" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAB79F"/>
