    <rect x="89.5" y="75.5" width="333" height="361" rx="62.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" transform="rotate(-7 256 256)"/>
    <rect x="88" y="74" width="336" height="364" rx="64" fill="url(#sheet2)" transform="rotate(6 256 256)"/>
